[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpg-wireframer"
version = "0.1.0"
description = "Wireframer is middleware for RPG development"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "inkpython>=0.1.0",
    "unified-planning>=1.0.0",
    "pyperplan>=2.1",
    "up-pyperplan>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]
